<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equinox Editorial Lookbook — KAYAN Atelier</title>
  <meta name="description" content="Visual poetry, fluid drapery, and sculptural proportions captured on noble film." />
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg" />

  <!-- Google Fonts Preconnect & Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Core Design System & Tokens -->
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/animations.css" />
  <link rel="stylesheet" href="../assets/css/rtl.css" />

  <!-- Components CSS -->
  <link rel="stylesheet" href="../assets/css/components/header.css" />
  <link rel="stylesheet" href="../assets/css/components/megamenu.css" />
  <link rel="stylesheet" href="../assets/css/components/cart-drawer.css" />
  <link rel="stylesheet" href="../assets/css/components/search.css" />
  <link rel="stylesheet" href="../assets/css/components/product-card.css" />
  <link rel="stylesheet" href="../assets/css/components/modals.css" />
  <link rel="stylesheet" href="../assets/css/components/toasts.css" />
  <link rel="stylesheet" href="../assets/css/components/cursor.css" />
  <link rel="stylesheet" href="../assets/css/components/footer.css" />

  <!-- Lookbook Specific CSS -->
  <link rel="stylesheet" href="../assets/css/pages/lookbook.css" />

  <!-- CDNs: GSAP 3 & Lenis for silky smooth 60fps animations -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.0.45/dist/lenis.min.js"></script>
</head>
<body>
  <!-- Accessibility Skip Link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Tactile Grain Overlay -->
  <div class="grain-overlay" aria-hidden="true"></div>

  <!-- Page Transition Curtain -->
  <div class="transition-curtain">
    <div class="curtain-logo">K A Y A N</div>
  </div>

  <!-- Global Header Mount -->
  <div id="site-header-mount"></div>

  <!-- MAIN LOOKBOOK CONTENT -->
  <main id="main-content" class="lookbook-page-wrap">
    
    <header class="lookbook-hero container">
      <span class="pdp-brand-tag">Equinox Fall / Winter 2026 Visual Campaign</span>
      <h1 class="font-display font-bold text-4xl" style="margin-block:8px 12px; letter-spacing:-0.02em;">Form Meets Existence</h1>
      <p class="text-sm" style="color:var(--color-text-muted); line-height:1.6; max-width:620px; margin:0 auto 16px;">
        An exploration into weight, monolithic draping, and quiet architectural luxury. Click on any model silhouette to discover and acquire the featured garment.
      </p>

      <button id="btn-lookbook-audio" class="lookbook-audio-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        Play Salon Soundscape
      </button>
    </header>

    <!-- Chapter Navigation -->
    <nav class="lookbook-chapters-nav" aria-label="Lookbook Chapters">
      <button class="lookbook-chapter-btn active" data-chapter="all">Entire Visual Anthology</button>
      <button class="lookbook-chapter-btn" data-chapter="monolith">Chapter I: The Monolith</button>
      <button class="lookbook-chapter-btn" data-chapter="fluidity">Chapter II: Architectural Fluidity</button>
      <button class="lookbook-chapter-btn" data-chapter="solitude">Chapter III: Tactile Solitude</button>
    </nav>

    <!-- Horizontal Visual Scroller Track -->
    <div class="lookbook-track-container">
      <div id="lookbook-track-mount" class="lookbook-track"></div>
    </div>

  </main>

  <!-- Global Footer Mount -->
  <div id="site-footer-mount"></div>

  <!-- Application Bootstrap (Universal: works on file:/// and HTTP) -->
  <script src="../assets/js/kayan-bundle.js"></script>
</body>
</html>
