<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved Archive & Curated Wishlist — KAYAN Atelier</title>
  <meta name="description" content="Your personal portfolio of reserved silhouettes, coveted garments, and seasonal aspirational pieces." />
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg" />

  <!-- Google Fonts Preconnect & Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Core Design System & Tokens -->
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/animations.css" />
  <link rel="stylesheet" href="../assets/css/rtl.css" />

  <!-- Components CSS -->
  <link rel="stylesheet" href="../assets/css/components/header.css" />
  <link rel="stylesheet" href="../assets/css/components/megamenu.css" />
  <link rel="stylesheet" href="../assets/css/components/cart-drawer.css" />
  <link rel="stylesheet" href="../assets/css/components/search.css" />
  <link rel="stylesheet" href="../assets/css/components/product-card.css" />
  <link rel="stylesheet" href="../assets/css/components/modals.css" />
  <link rel="stylesheet" href="../assets/css/components/toasts.css" />
  <link rel="stylesheet" href="../assets/css/components/cursor.css" />
  <link rel="stylesheet" href="../assets/css/components/footer.css" />

  <!-- Wishlist Specific CSS -->
  <link rel="stylesheet" href="../assets/css/pages/wishlist.css" />

  <!-- CDNs: GSAP 3 & Lenis for silky smooth 60fps animations -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.0.45/dist/lenis.min.js"></script>
</head>
<body>
  <!-- Accessibility Skip Link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Tactile Grain Overlay -->
  <div class="grain-overlay" aria-hidden="true"></div>

  <!-- Page Transition Curtain -->
  <div class="transition-curtain">
    <div class="curtain-logo">K A Y A N</div>
  </div>

  <!-- Global Header Mount -->
  <div id="site-header-mount"></div>

  <!-- MAIN WISHLIST CONTENT -->
  <main id="main-content">
    <div class="container wishlist-page-wrap">
      
      <!-- Breadcrumbs -->
      <nav class="shop-breadcrumbs" aria-label="Breadcrumb Navigation" style="margin-bottom:16px;">
        <a href="../index.html">Atelier</a>
        <span>/</span>
        <span style="color:var(--color-text);">Saved Archive</span>
      </nav>

      <!-- Wishlist Title & Actions Bar -->
      <div class="wishlist-header-row">
        <div>
          <h1 class="font-display font-bold text-3xl">Saved Archive <span id="wishlist-total-count" style="font-size:18px; font-weight:400; color:var(--color-text-muted);"></span></h1>
          <p class="text-sm" style="color:var(--color-text-muted); margin-top:4px;">
            Your hand-selected vault of seasonal architectural pieces, reserved for future acquisition.
          </p>
        </div>
        <div>
          <button id="btn-share-wishlist" class="btn-filter-mobile" style="display:inline-flex; align-items:center; gap:8px; padding:10px 20px; font-size:12px; font-weight:600;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            Share Private Archive
          </button>
        </div>
      </div>

      <!-- Wishlist Grid Mount -->
      <div id="wishlist-page-mount"></div>

    </div>
  </main>

  <!-- Global Footer Mount -->
  <div id="site-footer-mount"></div>

  <!-- Application Bootstrap (Universal: works on file:/// and HTTP) -->
  <script src="../assets/js/kayan-bundle.js"></script>
</body>
</html>
