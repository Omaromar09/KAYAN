<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Archive & Collections — KAYAN Atelier</title>
  <meta name="description" content="Explore luxury architectural silhouettes across Women, Men, Kids, Botanical Beauty, and Tactile Living." />
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg" />

  <!-- Google Fonts Preconnect & Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Core Design System & Tokens -->
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/animations.css" />
  <link rel="stylesheet" href="../assets/css/rtl.css" />

  <!-- Components CSS -->
  <link rel="stylesheet" href="../assets/css/components/header.css" />
  <link rel="stylesheet" href="../assets/css/components/megamenu.css" />
  <link rel="stylesheet" href="../assets/css/components/cart-drawer.css" />
  <link rel="stylesheet" href="../assets/css/components/search.css" />
  <link rel="stylesheet" href="../assets/css/components/product-card.css" />
  <link rel="stylesheet" href="../assets/css/components/modals.css" />
  <link rel="stylesheet" href="../assets/css/components/toasts.css" />
  <link rel="stylesheet" href="../assets/css/components/cursor.css" />
  <link rel="stylesheet" href="../assets/css/components/footer.css" />

  <!-- PLP Shop Specific CSS -->
  <link rel="stylesheet" href="../assets/css/pages/shop.css" />

  <!-- CDNs: GSAP 3 & Lenis for silky smooth 60fps animations -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.0.45/dist/lenis.min.js"></script>
</head>
<body>
  <!-- Accessibility Skip Link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Tactile Grain Overlay -->
  <div class="grain-overlay" aria-hidden="true"></div>

  <!-- Page Transition Curtain -->
  <div class="transition-curtain">
    <div class="curtain-logo">K A Y A N</div>
  </div>

  <!-- Global Header Mount -->
  <div id="site-header-mount"></div>

  <!-- MAIN SHOP / PLP CONTENT -->
  <main id="main-content">
    
    <!-- Header Banner & Breadcrumbs -->
    <header class="shop-page-header">
      <div class="container">
        <nav class="shop-breadcrumbs" aria-label="Breadcrumbs">
          <a href="../index.html">Atelier</a>
          <span>/</span>
          <span style="color:var(--color-text);">Collections & Catalog</span>
        </nav>
        <div style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px;">
          <div>
            <h1 class="font-display font-bold text-3xl" style="letter-spacing:-0.02em;" data-i18n="shop.archive_title">Ready-to-Wear Archive</h1>
            <p class="text-sm" style="color:var(--color-text-muted); margin-top:6px; max-width:540px;" data-i18n="shop.archive_desc">
              Sculptural forms crafted from organic Egyptian cotton, Mongolian cashmere, raw mulberry silk, and architectural linen.
            </p>
          </div>
          <div style="font-size:12px; color:var(--color-accent); font-weight:600; text-transform:uppercase; letter-spacing:0.1em;">
            Equinox Fall / Winter 2026
          </div>
        </div>
      </div>
    </header>

    <!-- Main Layout Container -->
    <div class="container">
      <!-- Toolbar Controls -->
      <div class="shop-toolbar" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; padding-block:20px; border-bottom:1px solid var(--color-border-subtle);">
        <div style="display:flex; align-items:center; gap:20px;">
          <button id="mobile-filter-open-btn" class="btn-filter-mobile" style="display:none; align-items:center; gap:8px; padding:8px 16px; border:1px solid var(--color-border); border-radius:var(--radius-sm); font-size:12px; font-weight:600;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
            Filters
          </button>
          <span id="shop-result-count" style="font-size:13px; color:var(--color-text-muted); font-weight:500;">
            Loading archive silhouettes...
          </span>
        </div>

        <div style="display:flex; align-items:center; gap:20px;">
          <!-- Sort Selector -->
          <div style="display:flex; align-items:center; gap:8px; font-size:13px;">
            <label for="shop-sort-select" style="color:var(--color-text-muted);">Sort by:</label>
            <select id="shop-sort-select" style="padding:6px 12px; background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-sm); font-size:13px; color:var(--color-text); cursor:pointer;">
              <option value="recommended">Curator's Pick</option>
              <option value="newest">Latest Creations</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
              <option value="rating">Highest Rated</option>
            </select>
          </div>

          <!-- Grid Density Toggles -->
          <div class="view-toggles" style="display:flex; gap:4px;">
            <button class="view-btn" data-cols="2" aria-label="2 columns" title="2 Columns">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="18" rx="1"/><rect x="13" y="3" width="8" height="18" rx="1"/></svg>
            </button>
            <button class="view-btn active" data-cols="3" aria-label="3 columns" title="3 Columns">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="5" height="18" rx="1"/><rect x="9.5" y="3" width="5" height="18" rx="1"/><rect x="16" y="3" width="5" height="18" rx="1"/></svg>
            </button>
            <button class="view-btn" data-cols="4" aria-label="4 columns" title="4 Columns">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="3" width="4" height="18" rx="1"/><rect x="7.5" y="3" width="4" height="18" rx="1"/><rect x="13" y="3" width="4" height="18" rx="1"/><rect x="18.5" y="3" width="4" height="18" rx="1"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Active Filters Chips Bar -->
      <div id="shop-active-chips" class="active-chips-bar" style="display:flex; flex-wrap:wrap; gap:8px; padding-block:12px;"></div>

      <!-- Main Two Column Grid (Sidebar Filters + Products Grid) -->
      <div class="shop-main-layout">
        <!-- Filter Sidebar -->
        <aside class="shop-sidebar" id="shop-sidebar-mount" aria-label="Product Filters">
          <!-- Dynamic Filter Controls injected by shop.js -->
        </aside>

        <!-- Product Listing & Load More -->
        <section class="shop-products-section" aria-label="Catalog Products">
          <div id="shop-products-grid" class="shop-grid cols-3">
            <!-- Dynamic Product Cards injected by shop.js -->
          </div>

          <div style="text-align:center; margin-block:48px;">
            <button id="shop-load-more" class="btn-submit-primary" style="display:none; width:auto; padding:12px 36px; margin-inline:auto;">
              Load More Silhouettes
            </button>
          </div>
        </section>
      </div>

      <!-- Recently Viewed Drawer Section -->
      <section style="margin-block:64px 80px; padding-top:40px; border-top:1px solid var(--color-border-subtle);">
        <h2 class="font-display font-bold text-xl" style="margin-bottom:20px;">Recently Contemplated</h2>
        <div id="recently-viewed-mount" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:20px;">
          <!-- Injected dynamically -->
        </div>
      </section>
    </div>

  </main>

  <!-- Global Footer Mount -->
  <div id="site-footer-mount"></div>

  <!-- Application Bootstrap (Universal: works on file:/// and HTTP) -->
  <script src="../assets/js/kayan-bundle.js"></script>
</body>
</html>
